<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>AssetScope — inventario, garantías y fin de soporte</title>
<style>
:root{
  --bg:#0e131c; --bg2:#131a26; --panel:#1a2233; --panel2:#212b40; --panel3:#28344d;
  --line:#33415c; --line2:#435373;
  --tx:#eaf0fb; --tx2:#b3c1da; --tx3:#8797b5;
  --acc:#59a9ff; --accbg:#16375c; --accbd:#3d7ab8;
  --ok:#2fd07a; --warn:#ffb020; --bad:#ff5c6c; --gold:#ffd166;
  --okbg:#2fd07a1a; --warnbg:#ffb0201f; --badbg:#ff5c6c1f;
  --sh:0 18px 50px -22px #000;
  --f:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  --m:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
html[data-theme="light"]{
  --bg:#eaeef5; --bg2:#e2e8f1; --panel:#ffffff; --panel2:#f1f4fa; --panel3:#e5eaf3;
  --line:#c3cede; --line2:#a9b8ce;
  --tx:#111827; --tx2:#4a5772; --tx3:#6b7a94;
  --acc:#1f6fd0; --accbg:#dceaff; --accbd:#7fb1ec;
  --ok:#12a355; --warn:#b26a00; --bad:#c62b3c; --gold:#a06a00;
  --okbg:#12a3551a; --warnbg:#b26a001a; --badbg:#c62b3c1a;
  --sh:0 10px 30px -16px #7b88a0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f);overflow:hidden}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid var(--bg2)}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}

/* ---------- barra superior ---------- */
#top{min-height:54px;display:flex;align-items:center;gap:9px;padding:7px 14px;background:var(--panel);border-bottom:2px solid var(--line);position:absolute;top:0;left:0;right:0;z-index:60;flex-wrap:wrap}
#top .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.2px;flex:0 0 auto}
#top .brand i{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);display:block}
#top .brand small{display:block;font-weight:500;font-size:11px;color:var(--tx3);letter-spacing:0}
.sep{width:1px;height:28px;background:var(--line);flex:0 0 auto}
.spacer{flex:1}
.btn{flex:0 0 auto;white-space:nowrap;background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:8px 12px;border-radius:8px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:6px;transition:.13s}
.btn:hover{background:var(--panel3);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.btn.acc{background:var(--accbg);border-color:var(--accbd);color:var(--acc)}
.btn.acc:hover{filter:brightness(1.15)}
.btn.danger:hover,.btn.danger.armed{background:#4a1a24;border-color:var(--bad);color:#ffd7dc}
html[data-theme="light"] .btn.danger:hover,html[data-theme="light"] .btn.danger.armed{background:#ffe4e8;color:#8d1524}
.btn.sm{padding:5px 8px;font-size:11.5px}
.tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:3px;flex:0 0 auto}
.tabs button{background:none;border:0;color:var(--tx2);padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:650;display:flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--tx);background:var(--panel3)}
.tabs button.on{background:var(--accbg);color:var(--acc)}
.tabs button .n{font-family:var(--m);font-size:10.5px;background:var(--bad);color:#fff;border-radius:9px;padding:1px 6px;font-weight:700}
.tabs button .n:empty{display:none}
.swrap{position:relative;flex:0 1 240px;min-width:120px;display:flex}
#search{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 11px;font-size:13px;outline:none}
#search::placeholder{color:var(--tx3)}
#search:focus{border-color:var(--acc);box-shadow:0 0 0 3px #59a9ff33}
.pill{flex:0 0 auto;font-size:11.5px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);padding:6px 10px;border-radius:20px;font-family:var(--m)}
.zoomwrap{display:flex;align-items:center;gap:2px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:2px;flex:0 0 auto}
.zoomwrap button{background:none;border:0;color:var(--tx2);padding:5px 9px;border-radius:6px;font-size:14px;line-height:1}
.zoomwrap button:hover{background:var(--panel3);color:var(--tx)}
.zoomwrap button:disabled{opacity:.35;background:none}
.menuwrap{position:relative;flex:0 0 auto}
.menu{position:fixed;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--sh);padding:5px;min-width:260px;display:none;z-index:70}
.menu.on{display:block}
.menu button{display:block;width:100%;background:none;border:0;color:var(--tx);padding:9px 10px;border-radius:7px;font-size:12.5px;text-align:left;font-weight:600}
.menu button:hover{background:var(--panel3)}
.menu button small{display:block;color:var(--tx3);font-size:10.5px;font-weight:400;margin-top:2px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.glow{box-shadow:0 0 0 3px var(--acc)!important;border-radius:12px}

/* ---------- lienzo ---------- */
#stage{position:absolute;top:54px;right:0;bottom:0;left:0;overflow:auto;background:radial-gradient(1000px 600px at 20% -10%,var(--bg2),transparent 60%),var(--bg)}
#view{max-width:1180px;margin:0 auto;padding:22px 24px 110px}
.vh{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.vh h2{margin:0;font-size:19px;letter-spacing:.2px}
.vh p{margin:3px 0 0;font-size:12.5px;color:var(--tx3)}
.vh .grow{flex:1;min-width:220px}

/* semaforo */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;transition:.15s;color:var(--tx)}
.kpi:hover{border-color:var(--acc)}
.kpi .big{font-size:34px;font-weight:750;font-family:var(--m);line-height:1}
.kpi .lb{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.kpi small{font-size:11px;color:var(--tx3)}
.kpi.bad{border-color:#ff5c6c88;background:linear-gradient(180deg,var(--badbg),transparent),var(--panel)} .kpi.bad .big{color:var(--bad)}
.kpi.warn{border-color:#ffb02088;background:linear-gradient(180deg,var(--warnbg),transparent),var(--panel)} .kpi.warn .big{color:var(--warn)}
.kpi.ok .big{color:var(--ok)}
.kpi.none .big{color:var(--tx3)}
.kpi.off{opacity:.45}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.dot.ok{background:var(--ok)}
.dot.none{background:var(--tx3);opacity:.6}
.grp{margin-bottom:18px}
.gh{display:flex;align-items:center;gap:8px;padding:4px 2px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);font-weight:700;background:none;border:0;width:100%;text-align:left}
.gh .t{flex:1}
.gh:hover{color:var(--tx)}
.ev{display:grid;grid-template-columns:14px 92px 190px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;text-align:left;font-size:12.5px;color:var(--tx)}
.ev:hover{border-color:var(--acc)}
.ev.bad{border-left-color:var(--bad)} .ev.warn{border-left-color:var(--warn)} .ev.ok{border-left-color:var(--ok)} .ev.none{border-left-color:var(--line2)}
.ev .dt{font-family:var(--m);font-size:12px;color:var(--tx2)}
.ev .kind{font-weight:650;font-size:12px}
.ev .kind small,.ev .nm small{display:block;font-weight:400;color:var(--tx3);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .nm{min-width:0}
.ev .nm b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ev .rel{font-family:var(--m);font-size:11.5px;text-align:right;font-weight:700;white-space:nowrap}
.ev.bad .rel{color:var(--bad)} .ev.warn .rel{color:var(--warn)} .ev.ok .rel{color:var(--ok)} .ev.none .rel{color:var(--tx3);font-weight:500}
#fresh:empty{display:none}
#fresh{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--warnbg);border:1px solid #ffb02088;border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;width:min(1132px,calc(100% - 32px));margin:16px auto -8px;font-size:12.5px}
#fresh .t{flex:1 1 260px}
#fresh .items{display:flex;gap:6px;flex-wrap:wrap}
#fresh .items button{font-size:11.5px;padding:3px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);color:var(--tx);display:inline-flex;align-items:center;gap:6px}
#fresh .items button:hover{border-color:var(--acc)}
.ev .nw{font-style:normal;font-family:var(--m);font-size:9.5px;font-weight:700;background:var(--warn);color:#1a1200;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px;letter-spacing:.3px}
.empty{background:var(--panel);border:1px dashed var(--line2);border-radius:12px;padding:22px;font-size:13px;color:var(--tx2);line-height:1.6;text-align:center}

/* inventario */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;outline:none;color:var(--tx)}
.filters select:focus{border-color:var(--acc)}
.tw{background:var(--panel);border:1px solid var(--line2);border-radius:12px;overflow:auto;box-shadow:var(--sh)}
table.inv{border-collapse:collapse;width:100%;font-size:12.5px;min-width:900px}
table.inv th{position:sticky;top:0;background:var(--panel2);text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;cursor:pointer;user-select:none}
table.inv th:hover{color:var(--tx)}
table.inv th.on{color:var(--acc)}
table.inv td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
table.inv td small{display:block;color:var(--tx3);font-size:10.5px;margin-top:1px}
table.inv tr.r{cursor:pointer}
table.inv tr.r:hover td{background:var(--panel3)}
table.inv tr.flash td{animation:fl 1.6s ease-out}
@keyframes fl{0%,40%{background:#ffd16644}}
table.inv td.mono{font-family:var(--m);font-size:11.5px}
table.inv td.dim{color:var(--tx3)}
.stt{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid;white-space:nowrap}
.dl{font-family:var(--m);font-size:11.5px;display:inline-flex;align-items:center;gap:5px}
.dl .dot{width:8px;height:8px;box-shadow:none}
.foot-n{font-size:11.5px;color:var(--tx3);padding:9px 2px}

/* informe */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.card .big{font-size:27px;font-weight:750;font-family:var(--m);line-height:1.1}
.card .lb{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3);font-weight:700;margin-bottom:6px}
.card small{display:block;font-size:11.5px;color:var(--tx2);margin-top:5px;line-height:1.4}
.card.warn .big{color:var(--warn)} .card.bad .big{color:var(--bad)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:13px 15px;box-shadow:var(--sh);overflow-x:auto}
table.rep td,table.rep th{white-space:nowrap}
.box h3{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:12px;margin-bottom:8px}
.brow b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow span{font-family:var(--m);font-size:11.5px;color:var(--tx2);text-align:right}
.brow .bar{grid-column:1/3;height:6px;border-radius:3px;background:var(--bg2);overflow:hidden}
.brow .bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
table.rep{border-collapse:collapse;width:100%;font-size:12.5px}
table.rep th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);padding:8px 10px;border-bottom:1px solid var(--line2);background:var(--panel2)}
table.rep td{padding:7px 10px;border-bottom:1px solid var(--line)}
table.rep td.num,table.rep th.num{text-align:right;font-family:var(--m)}
table.rep tr.tot td{font-weight:750;border-bottom:0}
table.rep tr.r{cursor:pointer} table.rep tr.r:hover td{background:var(--panel3)}

/* ---------- modal ---------- */
#veil{position:fixed;inset:0;background:#05080ecc;backdrop-filter:blur(3px);display:none;z-index:300;align-items:center;justify-content:center}
#veil.on{display:flex}
.modal{width:480px;max-width:94vw;background:var(--panel);border:2px solid var(--line2);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.modal.wide{width:820px}
.modal h3{margin:0;padding:14px 16px;font-size:14px;background:var(--panel2);border-bottom:1px solid var(--line2);letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.modal h3 .inv{font-family:var(--m);color:var(--gold);font-size:12.5px}
.modal .body{padding:15px 16px;display:flex;flex-direction:column;gap:12px;max-height:72vh;overflow:auto}
.modal .foot{padding:12px 16px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;background:var(--panel2);flex-wrap:wrap}
.fs{border:1px solid var(--line);border-radius:10px;padding:11px 12px 12px;margin:0}
.fs legend{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--acc);font-weight:700;padding:0 5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3);margin-bottom:5px;font-weight:700}
.fld input,.fld select,.fld textarea{width:100%;background:var(--bg2);border:1.5px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px #59a9ff33}
.fld textarea{resize:vertical;min-height:54px;line-height:1.45}
.fld input.mono{font-family:var(--m)}
.fld .st{font-size:11px;margin-top:4px;font-family:var(--m);min-height:14px}
.fld .st.bad{color:var(--bad)} .fld .st.warn{color:var(--warn)} .fld .st.ok{color:var(--ok)}
html[data-theme="dark"] input[type=date]{color-scheme:dark}
.hint{font-size:11.5px;color:var(--tx3);line-height:1.5}
.hint b{color:var(--tx2)}
.warnline{font-size:11.5px;color:var(--warn);font-weight:600}
.hl{display:flex;flex-direction:column;gap:5px}
.hl .it{display:flex;gap:8px;align-items:flex-start;font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.hl .it .d{font-family:var(--m);font-size:11px;color:var(--tx3);flex:0 0 auto;padding-top:1px}
.hl .it .t{flex:1;line-height:1.4;word-break:break-word}
.hl .it a{color:var(--acc);word-break:break-all}
.hl .it button{background:none;border:0;color:var(--tx3);padding:0 2px;font-size:12px}
.hl .it button:hover{color:var(--bad)}
.hl .it button.cp:hover{color:var(--acc)}
.addrow{display:flex;gap:6px;margin-top:6px}
.addrow input{background:var(--bg2);border:1.5px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12.5px;outline:none;min-width:0}
.addrow input:focus{border-color:var(--acc)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--tx2);line-height:1.45}
.chk input{margin-top:3px}
.prev{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.prev table{border-collapse:collapse;width:100%;font-size:11.5px}
.prev td,.prev th{padding:4px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.prev th{background:var(--panel2);color:var(--tx3);font-size:10px;text-transform:uppercase}
.tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid var(--line2);color:var(--tx2)}
.tag.new{color:var(--ok);border-color:#2fd07a66} .tag.upd{color:var(--acc);border-color:var(--accbd)} .tag.skip{color:var(--tx3)}
.qrprev{display:flex;gap:14px;align-items:center;background:#fff;color:#000;border-radius:10px;padding:10px 12px;border:1px solid var(--line2)}
.qrprev svg{width:96px;height:96px;flex:0 0 auto}
.qrprev .lt b{display:block;font-family:var(--m);font-size:15px}
.qrprev .lt span{display:block;font-size:11.5px;color:#333}

#savest.ok{color:var(--ok);border-color:#2fd07a55}
#savest.bad{color:var(--bad);border-color:#ff5c6c66;font-weight:700}
#warn{display:none;position:absolute;left:0;right:0;z-index:58;background:var(--bad);color:#fff;font-size:12.5px;font-weight:600;padding:8px 14px;align-items:center;gap:10px}
#warn.on{display:flex}
#warn button{background:#00000033;border:1px solid #ffffff55;color:#fff;padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:700}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel);border:1.5px solid var(--acc);padding:10px 16px;border-radius:10px;font-size:13px;z-index:400;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--sh);font-weight:600}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
#toast .act{margin-left:10px;background:var(--acc);border:0;color:#fff;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:700;pointer-events:auto}
#cap{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:420;display:none;
  align-items:center;gap:14px;max-width:min(1000px,92vw);padding:14px 22px;border-radius:14px;
  background:linear-gradient(180deg,#0e131cf2,#0b0f17f2);border:2px solid var(--acc);
  box-shadow:0 24px 70px -18px #000,0 0 0 1px #0006;font-size:18px;font-weight:650;color:#fff;line-height:1.35}
#cap.on{display:flex}
#cap b{color:#59a9ff}
#cap button{background:#ffffff1a;border:1px solid #ffffff44;color:#fff;padding:6px 11px;border-radius:8px;font-size:12px;font-weight:700;flex:0 0 auto}
#tour.on{background:var(--acc);border-color:var(--acc);color:#fff}
#ver{background:none;border:0;padding:0;margin-left:5px;font:inherit;color:var(--acc);cursor:pointer}
#ver:hover{text-decoration:underline}
.nv h4{margin:14px 0 4px;font-size:13px}
.nv h4:first-child{margin-top:0}
.nv h4 span{font-weight:400;color:var(--tx3);font-size:11.5px;margin-left:6px}
.nv ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.6;color:var(--tx2)}

@media (max-width:700px){
  #top{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  #top::-webkit-scrollbar{display:none}
  #top .brand small,#stats,#savest{display:none}
  .swrap{flex:0 0 170px}
}
@media (max-width:900px){
  .kpis,.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{grid-template-columns:1fr}
  .ev{grid-template-columns:14px 1fr auto;row-gap:4px}
  .ev .dt{grid-column:2} .ev .kind{grid-column:2/4} .ev .nm{grid-column:2/4} .ev .rel{grid-row:1;grid-column:3}
  .g3,.g4{grid-template-columns:1fr 1fr}
  #view{padding:16px 16px 110px}
}

/* ---------- impresion / PDF y etiquetas ---------- */
#print{display:none}
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{overflow:visible;background:#fff;color:#000}
  #top,#stage,#veil,#toast,#warn,#cap,.menu{display:none!important}
  #print{display:block;font-family:var(--f);color:#000}
  #print h1{font-size:18px;margin:0 0 2px}
  #print .meta{font-size:11px;color:#555;margin-bottom:14px}
  #print h2{font-size:13px;margin:18px 0 6px;border-bottom:2px solid #000;padding-bottom:3px;page-break-after:avoid}
  #print .pb{page-break-before:always}
  #print table{width:100%;border-collapse:collapse;font-size:9.5px;margin-bottom:8px}
  #print th{background:#eee;text-align:left;border:1px solid #999;padding:4px 5px}
  #print td{border:1px solid #bbb;padding:3px 5px;vertical-align:top}
  #print td.num,#print th.num{text-align:right}
  #print td.nw{white-space:nowrap}
  #print tr{page-break-inside:avoid}
  #print .kp{display:flex;gap:8px;margin:6px 0 4px}
  #print .kp div{flex:1;border:1.5px solid #000;border-radius:6px;padding:7px 9px;font-size:10px}
  #print .kp b{display:block;font-size:17px}
  #print .s-bad{color:#b00020;font-weight:700} #print .s-warn{color:#8a5a00;font-weight:700}
  #print .cols2{display:flex;gap:12px} #print .cols2>div{flex:1}
  body.labels #print{display:block}
  @page labels{size:A4 portrait;margin:0}
  .sheet{page:labels;display:grid;grid-template-columns:repeat(3,70mm);grid-auto-rows:37mm;width:210mm}
  .lab{height:37mm;padding:3mm 3mm 3mm 4mm;display:flex;gap:3mm;align-items:center;overflow:hidden;page-break-inside:avoid}
  .lab svg{width:29mm;height:29mm;flex:0 0 auto}
  .lab .lt{min-width:0;font-size:8.5pt;line-height:1.25}
  .lab .lt b{display:block;font-family:var(--m);font-size:11.5pt;margin-bottom:1mm}
  .lab .lt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lab .lt .own{font-size:7pt;color:#444;margin-top:1mm}
}

  const SKIP=new Set(["SCRIPT","STYLE","TEXTAREA","INPUT","CODE"]);
  function core(s){
    let r=D.get(s);if(r!=null)return r;
    for(const [re,f] of P){const m=re.exec(s);if(m){const x=typeof f==="function"?f(...m):s.replace(re,f);if(x!==s)return x;}}

    for(const sep of [" · "," › "," / "]){
      if(!s.includes(sep))continue;
      let any=false;const parts=s.split(sep).map(p=>{const t=p.trim()?core(p.trim()):null;if(t!=null){any=true;return t;}return p;});
      if(any)return parts.join(sep);
    }
    return null;
  }
  function tr(s){
    if(lang==="es"||s==null)return s;
    s=String(s);const m=/^(\s*)([\s\S]*?)(\s*)$/.exec(s);
    if(!m[2]||!/[A-Za-zÁÉÍÓÚáéíóúÑñ¿¡]/.test(m[2]))return s;
    if(m[2].includes("\n"))return m[1]+m[2].split("\n").map(tr).join("\n")+m[3];   // avisos de varias lineas
    const r=core(m[2]);return r==null?s:m[1]+r+m[3];
  }
  const ATTR=["title","placeholder","aria-label"];
  function doEl(el){
    if(el.closest&&el.closest("[data-notr]"))return;
    ATTR.forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(v){const t=tr(v);if(t!==v)el.setAttribute(a,t);}});
    if(el.tagName==="INPUT"&&(el.type==="button"||el.type==="submit")&&el.value){const t=tr(el.value);if(t!==el.value)el.value=t;}
  }
  function doText(n){
    const p=n.parentNode;if(!p||SKIP.has(p.nodeName)||(p.closest&&p.closest("[data-notr]")))return;
    const v=n.nodeValue,t=tr(v);if(t!==v)n.nodeValue=t;
  }
  function walk(root){
    if(lang==="es"||!root)return;
    if(root.nodeType===3){doText(root);return;}
    if(root.nodeType!==1&&root.nodeType!==9&&root.nodeType!==11)return;
    if(root.nodeType===1){if(root.nodeName==="SCRIPT"||root.nodeName==="STYLE")return;doEl(root);}

  }

  a.ubicacion={sala:t80(u.sala,120),rack:t80(u.rack,60),u:t80(u.u,10)};
  a.asignado=t80(x.asignado,120);
  const c=x.compra&&typeof x.compra==="object"?x.compra:{};

  const y=x.ciclo&&typeof x.ciclo==="object"?x.ciclo:{};
  a.ciclo={garantia:isoOk(y.garantia),soporte:isoOk(y.soporte),mantenimiento:isoOk(y.mantenimiento),renovacion:precio(y.renovacion)};
  a.historial=(Array.isArray(x.historial)?x.historial:[]).filter(h=>h&&typeof h==="object"&&str(h.texto).trim())
    .map(h=>({fecha:isoOk(h.fecha)||"",texto:t80(h.texto,1000)})).slice(0,500);

    .map(h=>({nombre:t80(h.nombre,120),ruta:t80(h.ruta,1000)})).slice(0,100);
  a.notas=t80(x.notas,4000);

function parseDB(d){
  if(!d||typeof d!=="object"||!Array.isArray(d.activos))return null;
  const c=d.cfg&&typeof d.cfg==="object"?d.cfg:{};
  const db={v:1,app:"assetscope",theme:d.theme==="light"?"light":"dark",tab:["cad","inv","rep"].includes(d.tab)?d.tab:"cad",
    cfg:{aviso:Math.max(1,Math.min(730,Math.round(+c.aviso)||90)),viejo:Math.max(1,Math.min(30,Math.round(+c.viejo)||5)),
      empresa:t80(c.empresa,80),qr:c.qr==="enlace"?"enlace":"texto",qrBase:/^https?:\/\//i.test(str(c.qrBase))?t80(c.qrBase,300):""},
    activos:d.activos.map(cleanAsset).filter(Boolean)};
  const ids=new Set(),invs=new Set();
  db.activos.forEach(a=>{if(ids.has(a.id))a.id=nid("a");ids.add(a.id);
    if(a.inv&&invs.has(a.inv.toUpperCase()))a.inv="";if(a.inv)invs.add(a.inv.toUpperCase());});

}

function idb(){return new Promise(res=>{try{const q=indexedDB.open("assetscope",1);
  q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);}catch(e){res(null);}});}
async function idbPut(k,v){const d=await idb();if(!d)return;try{d.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){}}
async function idbGet(k){const d=await idb();if(!d)return null;return new Promise(res=>{try{
  const q=d.transaction("kv","readonly").objectStore("kv").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
async function writeFile(){
  if(!fileHandle)return false;
  try{const w=await fileHandle.createWritable();await w.write(JSON.stringify(DB,null,2));await w.close();updateSaveUI();return true;}
  catch(e){toast("No se pudo escribir en el archivo vinculado");return false;}
}

async function linkFile(){

  try{
    fileHandle=await showSaveFilePicker({suggestedName:"assetscope-inventario.json",types:FTYPES});
    fileName=fileHandle.name;await idbPut("handle",fileHandle);await idbPut("name",fileName);
    await writeFile();toast("Guardado automático en "+fileName);
  }catch(e){}

async function openFile(){
  if(!window.showOpenFilePicker){toast("Usa Importar para cargar el JSON");return;}
  try{

    const d=parseDB(JSON.parse(await (await h.getFile()).text()));if(!d)throw 0;
    DB=d;fileHandle=h;fileName=h.name;await idbPut("handle",h);await idbPut("name",fileName);
    setTheme(DB.theme);save();render();toast("Cargado desde "+fileName);

}
async function restoreHandle(){
  try{
    const h=await idbGet("handle");if(!h)return;
    const perm=await h.queryPermission({mode:"readwrite"});
    if(perm==="granted"){
      fileHandle=h;fileName=h.name;
      try{const d=parseDB(JSON.parse(await (await h.getFile()).text()));if(d){DB=d;setTheme(DB.theme);UNDO=[];REDO=[];hData=dataKey();histUI();checkFresh();render();}}catch(e){}
    }else toast("Pulsa 💾 Archivo para reconectar "+(await idbGet("name")||"tu archivo"));
  }catch(e){}
  updateSaveUI();
}

const SEEN=KEY+".seen";

function markSeen(){try{localStorage.setItem(SEEN,JSON.stringify({d:todayIso(),k:events().filter(e=>e.lvl!=="ok").map(evKey)}));}catch(e){}}
function checkFresh(){
  let prev=null;try{prev=JSON.parse(localStorage.getItem(SEEN)||"null");}catch(e){}
  if(!prev||!Array.isArray(prev.k)){FRESH=null;markSeen();return;}
  const old=new Set(prev.k),nuevos=events().filter(e=>e.lvl!=="ok"&&!old.has(evKey(e)));
  if(!nuevos.length){FRESH=null;markSeen();return;}
  FRESH={desde:isoOk(prev.d),list:nuevos,keys:new Set(nuevos.map(evKey))};

function renderFresh(){
  const box=$("#fresh");

    const cur=new Set(events().map(evKey));FRESH.list=FRESH.list.filter(e=>cur.has(evKey(e)));FRESH.keys=new Set(FRESH.list.map(evKey));
    if(!FRESH.list.length){FRESH=null;markSeen();}
  }
  if(!FRESH){box.innerHTML="";return;}
  const w=FRESH.list.filter(e=>e.lvl==="warn").length,b=FRESH.list.length-w,av=DB.cfg.aviso;

                    w===1?`1 end date is now within the next ${av} days`:`${w} end dates are now within the next ${av} days`));
  if(b)parts.push(L(b===1?"1 ha vencido":`${b} han vencido`,b===1?"1 has expired":`${b} have expired`));
  const desde=FRESH.desde?L(` (${fdate(FRESH.desde)})`,` (${fdate(FRESH.desde)})`):"";
  box.innerHTML=`<span class="t">🔔 <b>${L("Desde tu última visita","Since your last visit")}${desde}:</b> ${parts.join(L(" y "," and "))}.</span>
    <span class="items">${FRESH.list.slice(0,6).map(e=>`<button data-fo="${e.a.id}"><span class="dot ${e.lvl}"></span>${esc(e.a.nombre)} · ${esc(T(CICLO[e.k]))}</button>`).join("")}${FRESH.list.length>6?`<span>+${FRESH.list.length-6}</span>`:""}</span>

function sortVal(a,k){
  switch(k){
    case "tipo":return TYPES[a.tipo];case "modelo":return what(a);case "estado":return ESTADOS[a.estado].n;
    case "sala":return where(a);case "fecha":return a.compra.fecha||"9999";
    case "cad":{const w=peor(a);return w?w.iso:"9999";}
    default:return str(a[k]);
  }
}

function bindInv(){

function bars(rows,tot,money){
  const mx=Math.max(1,...rows.map(r=>r[1]));
  return rows.map(([lb,v,sub])=>`<div class="brow"><b title="${esc(lb)}">${esc(lb)}</b><span>${money?eur(v):v}${sub?" · "+sub:""}</span><div class="bar"><i style="width:${(v/mx*100).toFixed(1)}%"></i></div></div>`).join("")
    ||'<div class="hint">Sin datos</div>';
}
function repData(){
  const act=activos(),cfg=DB.cfg;
  const valor=act.reduce((s,a)=>s+a.compra.precio,0);
  const viejos=act.filter(a=>{const e=edad(a);return e!=null&&e>=cfg.viejo;});
  const ev=events(act),venc=ev.filter(e=>e.lvl==="bad");
  const anio=ev.filter(e=>e.d>=0&&e.d<=365);
  const ren=new Map();anio.forEach(e=>{if(!ren.has(e.a.id))ren.set(e.a.id,e.a.ciclo.renovacion||e.a.compra.precio);});
  const coste=[...ren.values()].reduce((s,v)=>s+v,0);
  const porTipo={};act.forEach(a=>{const t=porTipo[a.tipo]||(porTipo[a.tipo]={n:0,v:0});t.n++;t.v+=a.compra.precio;});
  const porEst={};DB.activos.forEach(a=>porEst[a.estado]=(porEst[a.estado]||0)+1);
  const ed=[["Menos de 1 año",0],["De 1 a 3 años",0],["De 3 a "+cfg.viejo+" años",0],[cfg.viejo+" años o más",0],["Sin fecha de compra",0]];
  act.forEach(a=>{const e=edad(a);ed[e==null?4:e<1?0:e<3?1:e<cfg.viejo?2:3][1]++;});
  if(cfg.viejo<=3){ed[1][0]="De 1 a "+cfg.viejo+" años";ed.splice(2,1);}
  const porSala={};act.forEach(a=>{const s=a.ubicacion.sala||"Sin ubicación";porSala[s]=(porSala[s]||0)+1;});
  return {act,valor,viejos,venc,anio,ren,coste,porTipo,porEst,ed,porSala};
}

    <div class="card bad"><div class="lb">Caduca en 12 meses</div><div class="big">${r.ren.size}</div><small>Renovarlo costaría unos <b>${eur(r.coste)}</b></small></div>
  </div>
  <div class="cols">

    ${(()=>{const vistos=new Set();return r.anio.map(e=>{const pr=!vistos.has(e.a.id);vistos.add(e.a.id);

    <div class="hint" style="margin-top:8px">Se usa el <b>coste de renovación</b> de la ficha. Si no lo tiene, el precio de compra (marcado con *). Cada equipo cuenta una vez.</div>`

  </div>
  ${r.viejos.length?`<div class="box"><h3>Equipos con ${cfg.viejo} años o más</h3><table class="rep"><tr><th>Equipo</th><th>Tipo</th><th>Marca y modelo</th><th>Compra</th><th class="num">Antigüedad</th><th>Ubicación</th></tr>
    ${r.viejos.sort((a,b)=>a.compra.fecha<b.compra.fecha?-1:1).map(a=>`<tr class="r" data-open="${a.id}"><td><b>${esc(a.nombre)}</b></td><td>${esc(TYPES[a.tipo])}</td><td>${esc(what(a))}</td><td>${fdate(a.compra.fecha)}</td><td class="num">${String(Math.round(edad(a)*10)/10).replace(".",",")} años</td><td>${esc(where(a))}</td></tr>`).join("")}</table></div>`:""}`;
  view.innerHTML=h;
  $("#rPdf").onclick=expPDF;$("#rCsv").onclick=expCSV;
}

/* ---------- codigo QR (modo byte, correccion M, versiones 1 a 20) ---------- */
const QR=(()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26];
  const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16];
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36;}return r;};
  const dataCw=v=>Math.floor(raw(v)/8)-ECC[v]*BLK[v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z;};
  function divisor(deg){const r=new Array(deg).fill(0);r[deg-1]=1;let root=1;
    for(let i=0;i<deg;i++){for(let j=0;j<r.length;j++){r[j]=mul(r[j],root);if(j+1<r.length)r[j]^=r[j+1];}root=mul(root,2);}return r;}
  function remainder(data,div){const r=div.map(()=>0);
    data.forEach(b=>{const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f));});return r;}
  function alignPos(v,size){if(v===1)return [];const n=Math.floor(v/7)+2,step=Math.ceil((v*4+4)/(n*2-2))*2,r=[6];
    for(let p=size-7;r.length<n;p-=step)r.splice(1,0,p);return r;}
  return function encode(text){
    const bytes=[...new TextEncoder().encode(text)];
    const eci=bytes.some(b=>b>127)?12:0;                // ECI 26: avisa al lector de que el texto va en UTF-8 (tildes y eñes)
    let v=1;for(;v<=20;v++){if(eci+4+(v<=9?8:16)+bytes.length*8<=dataCw(v)*8)break;}
    if(v>20)throw new Error("Texto demasiado largo para el QR");
    const bits=[];const put=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>>i)&1);};
    if(eci){put(7,4);put(26,8);}
    put(4,4);put(bytes.length,v<=9?8:16);bytes.forEach(b=>put(b,8));
    const cap=dataCw(v)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((a,b)=>a<<1|b,0));
    // bloques de correccion de errores e intercalado
    const nb=BLK[v],el=ECC[v],rc=Math.floor(raw(v)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),div=divisor(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sl-el+(i<ns?0:1));k+=d.length;const e=remainder(d,div);if(i<ns)d.push(0);blocks.push(d.concat(e));}
    const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-el||j>=ns)cw.push(b[i]);});
    // matriz
    const size=v*4+17,M=[],F=[];for(let y=0;y<size;y++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false));}
    const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true;};
    for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
    [[3,3],[size-4,3],[3,size-4]].forEach(([cx,cy])=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
      const x=cx+dx,y=cy+dy,dd=Math.max(Math.abs(dx),Math.abs(dy));if(x>=0&&x<size&&y>=0&&y<size)set(x,y,dd!==2&&dd!==4);}});
    const ap=alignPos(v,size),na=ap.length;
    for(let i=0;i<na;i++)for(let j=0;j<na;j++){if((i===0&&j===0)||(i===0&&j===na-1)||(i===na-1&&j===0))continue;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(ap[i]+dx,ap[j]+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);}
    const fmtBits=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);return ((d<<10)|r)^0x5412;};
    const drawFmt=mask=>{const b=fmtBits(mask),g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
      for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true);};
    drawFmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=(v<<12)|r;
      for(let i=0;i<18;i++){const bit=((b>>>i)&1)!==0,aa=size-11+i%3,bb=Math.floor(i/3);set(aa,bb,bit);set(bb,aa,bit);}}
    let i=0;
    for(let right=size-1;right>=1;right-=2){if(right===6)right=5;
      for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;
        if(!F[y][x]&&i<cw.length*8){M[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)!==0;i++;}}}
    const MASKS=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
      (x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MASKS[m](x,y))M[y][x]=!M[y][x];};
    // penalizacion simplificada: rachas, bloques 2x2 y equilibrio de oscuros
    const penalty=()=>{let p=0,dark=0;
      for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1;}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1;}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3;}
      for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(M[y][x])dark++;
      return p+Math.floor(Math.abs(dark*20-size*size*10)/(size*size))*10;};
    let best=0,bp=Infinity;
    for(let m=0;m<8;m++){apply(m);drawFmt(m);const p=penalty();if(p<bp){bp=p;best=m;}apply(m);}
    apply(best);drawFmt(best);
    return M;
  };
})();
function qrSVG(text,quiet){
  const M=QR(text),n=M.length,b=quiet==null?4:quiet;let d="";   // en la etiqueta el blanco de alrededor ya hace de margen
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(M[y][x])d+=`M${x+b},${y+b}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*b} ${n+2*b}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function qrText(a){
  const c=DB.cfg;
  if(c.qr==="enlace"&&c.qrBase)return c.qrBase.replace(/#.*$/,"")+"#inv="+encodeURIComponent(a.inv);
  return [a.inv,a.nombre,what(a),a.serie?"S/N "+a.serie:""].filter(Boolean).join("\n");   // solo lo que no cambia: QR menos denso y que no se queda viejo
}

function dl(blob,name){
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.style.display="none";
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},8000);return true;}catch(err){return false;}
}
// muestra el resultado para poder guardarlo a mano si el navegador bloquea la descarga

    <button class="btn acc" id="sv_dl">Descargar otra vez</button><button class="btn" id="sv_close">Cerrar</button></div>`;

  $("#sv_dl").onclick=()=>dl(blob,name);

  $("#sv_copy").onclick=()=>{const t=$("#sv_txt");t.select();try{document.execCommand("copy");toast("Copiado al portapapeles");}catch(err){toast("Selecciona el texto y copia con Ctrl+C");}};
}

const icsTxt=s=>String(s==null?"":s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
function icsFold(line){   // lineas de 75 bytes como pide el RFC 5545, sin partir caracteres UTF-8
  const enc=new TextEncoder();if(enc.encode(line).length<=75)return line;
  const out=[];let cur="",n=0,lim=75;
  for(const ch of line){const b=enc.encode(ch).length;if(n+b>lim){out.push(cur);cur=" ";n=1;lim=75;}cur+=ch;n+=b;}
  out.push(cur);return out.join("\r\n");
}
const icsDay=iso=>iso.replace(/-/g,"");
function icsPlan(offs){
  const out=[];
  events().forEach(e=>offs.forEach(o=>{
    const d=new Date(+e.iso.slice(0,4),+e.iso.slice(5,7)-1,+e.iso.slice(8,10)-o),iso=isoOf(d);
    if(iso>=todayIso())out.push({e,o,iso});}));
  return out.sort((x,y)=>x.iso<y.iso?-1:x.iso>y.iso?1:0);
}
function icsBuild(plan){
  const now=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L1=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//AssetScope//Vencimientos//"+(I18N.lang==="en"?"EN":"ES"),"CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "X-WR-CALNAME:"+icsTxt(L("AssetScope — vencimientos","AssetScope — expiry dates")+(DB.cfg.empresa?" · "+DB.cfg.empresa:""))];
  plan.forEach(({e,o,iso})=>{
    const a=e.a,k=T(CICLO[e.k]),nx=new Date(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10)+1);
    const sum=o?L(`${a.nombre} · ${k} vence en ${o} días (${fdate(e.iso)})`,`${a.nombre} · ${k} expires in ${o} days (${fdate(e.iso)})`)
               :L(`${a.nombre} · ${k} vence hoy`,`${a.nombre} · ${k} expires today`);
    const desc=[
      L("Equipo: ","Device: ")+[a.inv,a.nombre].filter(Boolean).join(" · "),
      what(a)?L("Marca y modelo: ","Make and model: ")+what(a):"",
      a.serie?L("Nº de serie: ","Serial number: ")+a.serie:"",
      where(a)?L("Ubicación: ","Location: ")+where(a):"",
      a.asignado?L("Asignado a: ","Assigned to: ")+a.asignado:"",
      k+": "+L("fin el ","ends on ")+fdate(e.iso),
      a.ciclo.renovacion?L("Coste de renovación: ","Renewal cost: ")+eur(a.ciclo.renovacion):""].filter(Boolean)
      .concat("",L("Generado con AssetScope el ","Generated with AssetScope on ")+fdate(todayIso()));
    L1.push("BEGIN:VEVENT","UID:assetscope-"+a.id+"-"+e.k+"-"+icsDay(e.iso)+"-"+o+"@assetscope","DTSTAMP:"+now,
      "DTSTART;VALUE=DATE:"+icsDay(iso),"DTEND;VALUE=DATE:"+icsDay(isoOf(nx)),
      "SUMMARY:"+icsTxt((o?"⚠ ":"🔴 ")+sum),"DESCRIPTION:"+icsTxt(desc.join("\n")),
      "CATEGORIES:AssetScope","TRANSP:TRANSPARENT",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTxt(sum),"TRIGGER:-PT15H","END:VALARM","END:VEVENT");
  });
  L1.push("END:VCALENDAR");
  return L1.map(icsFold).join("\r\n")+"\r\n";
}

function importFile(f){
  if(f.size>20*1024*1024){toast("Archivo demasiado grande");return;}
  const rd=new FileReader();
  rd.onload=()=>{
    let txt=String(rd.result||"");
    if(impMode==="csv"){
      if(txt.includes("�")){const r2=new FileReader();r2.onload=()=>csvImport(f.name,String(r2.result||""));r2.readAsText(f,"windows-1252");return;}  // Excel en ANSI
      return csvImport(f.name,txt);
    }
    let d;try{d=JSON.parse(txt);}catch(e){toast("No es un JSON válido");return;}
    const rooms=rackRooms(d);
    if(rooms&&(impMode==="rack"||impMode==="auto"))return rackImport(f.name,rooms);
    const db=parseDB(d);
    if(db)return jsonImport(f.name,db);
    toast(impMode==="rack"?"No parece un JSON de RackScope":"No parece una copia de AssetScope");
  };
  rd.readAsText(f,"utf-8");
}

// CSV: separador, comillas y columnas reconocidas por sus nombres habituales
function csvRows(txt){
  txt=txt.replace(/^﻿/,"");
  const first=txt.split(/\r?\n/,1)[0]||"",sep=[";","\t",","].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],cur="",inq=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(inq){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=c;continue;}
    if(c==='"')inq=true;else if(c===sep){row.push(cur);cur="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&txt[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x.trim()))rows.push(row);row=[];}
    else cur+=c;
  }
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);
  return rows.map(r=>r.map(x=>x.trim().replace(/^'(?=[=+\-@])/,"")));
}

function mapCols(head){
  const map={},used=new Set(),h=head.map(norm);
  // primero coincidencias exactas, luego las que empiezan igual
  [x=>y=>x===y,x=>y=>y.length>2&&x.startsWith(y+" ")].forEach(test=>Object.keys(SYN).forEach(k=>{
    if(k in map)return;const i=h.findIndex((x,i)=>!used.has(i)&&SYN[k].some(test(x)));if(i>=0){map[k]=i;used.add(i);}}));
  return map;
}
function guessTipo(t,txt){
  const s=norm(t);const k=Object.keys(TYPES).find(k=>norm(TYPES[k])===s||k===s);if(k)return k;
  const x=norm((t||"")+" "+(txt||""));
  const R=[["portatil",/portatil|laptop|notebook|thinkpad|latitude|elitebook|macbook/],["servidor",/servidor|server|proliant|poweredge|esxi/],["switch",/switch|catalyst|aruba/],
    ["firewall",/firewall|cortafuegos|fortigate|pfsense|sophos/],["router",/router|mikrotik|enrutador/],["cabina",/nas|cabina|san|synology|qnap|storage/],
    ["sai",/sai|ups|smart ups/],["ap",/punto de acceso|access point|\bap\b|wifi|unifi/],["impresora",/impresora|printer|multifuncion|laserjet/],
    ["monitor",/monitor|pantalla/],["telefono",/telefono|phone|voip/],["movil",/movil|tablet|ipad|iphone|android/],["pc",/\bpc\b|sobremesa|desktop|torre|optiplex|prodesk/]];
  const f=R.find(([,re])=>re.test(x));return f?f[0]:"otro";

function guessEstado(t){
  const s=norm(t);if(!s)return "produccion";
  if(/baja|retir|desech|recicl|scrap|retired/.test(s))return "baja";if(/rma|repar|garantia|servicio tecnico/.test(s))return "rma";
  if(/almacen|stock|storage|reserva|disponible|spare/.test(s))return "almacen";if(/prest|loan/.test(s))return "prestado";return "produccion";
}

function csvImport(name,txt){
  const rows=csvRows(txt);
  if(rows.length<2){toast("El CSV no tiene filas");return;}
  // la cabecera no siempre es la primera fila: muchas hojas llevan un titulo encima
  const ok=m=>"nombre" in m||"serie" in m||"inv" in m;
  let hi=-1,map={};
  rows.slice(0,10).forEach((r,i)=>{const m=mapCols(r);if(ok(m)&&(hi<0||Object.keys(m).length>Object.keys(map).length)){hi=i;map=m;}});
  if(hi<0){toast("No encuentro la columna de nombre, nº de serie o inventario");return;}
  const head=rows[hi];rows.splice(0,hi+1,head);
  const g=(r,k)=>k in map?str(r[map[k]]).trim():"";
  const bySerie=new Map(DB.activos.filter(a=>a.serie).map(a=>[a.serie.toLowerCase(),a]));
  const byInv=new Map(DB.activos.map(a=>[a.inv.toLowerCase(),a]));
  const plan=[];
  rows.slice(1).forEach(r=>{
    const nombre=g(r,"nombre")||[g(r,"marca"),g(r,"modelo")].filter(Boolean).join(" ")||g(r,"serie");
    if(!nombre&&!g(r,"serie"))return;
    const hist=g(r,"historial").split("|").map(x=>x.trim()).filter(Boolean).map(x=>{const m=/^(\S+)\s+(.*)$/.exec(x),f=m&&parseFecha(m[1]);return f?{fecha:f,texto:m[2]}:{fecha:"",texto:x};});
    const a=cleanAsset({inv:g(r,"inv"),nombre,tipo:guessTipo(g(r,"tipo"),nombre+" "+g(r,"modelo")),marca:g(r,"marca"),modelo:g(r,"modelo"),serie:g(r,"serie"),
      estado:guessEstado(g(r,"estado")),ubicacion:{sala:g(r,"sala"),rack:g(r,"rack"),u:g(r,"u")},
      asignado:g(r,"asignado")&&g(r,"depto")?g(r,"asignado")+" ("+g(r,"depto")+")":g(r,"asignado")||g(r,"depto"),
      compra:{proveedor:g(r,"proveedor"),fecha:parseFecha(g(r,"fecha")),factura:g(r,"factura"),precio:precio(g(r,"precio")),centroCoste:g(r,"cc")},
      ciclo:{garantia:parseFecha(g(r,"garantia")),soporte:parseFecha(g(r,"soporte")),mantenimiento:parseFecha(g(r,"mantenimiento")),renovacion:precio(g(r,"renovacion"))},
      historial:hist,notas:g(r,"notas"),
      adjuntos:g(r,"adjuntos").split(" | ").map(x=>x.trim()).filter(Boolean).map(x=>{const m=/^([^:\\/]{1,120}):\s+(.+)$/.exec(x);return m?{nombre:m[1],ruta:m[2]}:{nombre:"",ruta:x};})});
    const prev=(a.serie&&bySerie.get(a.serie.toLowerCase()))||(a.inv&&byInv.get(a.inv.toLowerCase()))||null;
    plan.push({a,prev,hasTipo:!!g(r,"tipo"),hasEst:!!g(r,"estado")});
  });
  const nNew=plan.filter(p=>!p.prev).length,nUpd=plan.length-nNew;
  const lbl={inv:"Nº inventario",nombre:"Nombre",tipo:"Tipo",marca:"Marca",modelo:"Modelo",serie:"Nº de serie",estado:"Estado",sala:"Ubicación",rack:"Rack",u:"U",asignado:"Asignado",depto:"Departamento",
    proveedor:"Proveedor",fecha:"Fecha de compra",factura:"Factura",precio:"Precio",cc:"Centro de coste",garantia:"Garantía",soporte:"Soporte",mantenimiento:"Mantenimiento",renovacion:"Renovación",notas:"Notas",historial:"Historial",adjuntos:"Adjuntos"};
  const free=rows[0].filter((x,i)=>!Object.values(map).includes(i)&&x.trim());
  modal.className="modal wide";
  modal.innerHTML=`<h3>Importar ${esc(name)}</h3>
  <div class="body">
    <div class="hint"><b>${plan.length} filas</b>: ${nNew} equipo${nNew===1?"":"s"} nuevo${nNew===1?"":"s"} y ${nUpd} que ya existía${nUpd===1?"":"n"} (mismo nº de serie o de inventario). En los que ya existen solo se rellenan los datos que traiga el CSV; lo demás se queda como está.</div>
    <div class="hint">Columnas reconocidas: ${Object.keys(map).map(k=>`<span class="tag">${lbl[k]}</span>`).join(" ")}${free.length?`<br>Sin usar: ${free.map(x=>`<span class="tag skip">${esc(x)}</span>`).join(" ")}`:""}</div>
    <div class="prev"><table><tr><th></th><th>Nombre</th><th>Tipo</th><th>Marca y modelo</th><th>Serie</th><th>Ubicación</th><th>Garantía</th><th>Soporte</th></tr>
      ${plan.slice(0,200).map(p=>`<tr><td><span class="tag ${p.prev?"upd":"new"}">${p.prev?"actualiza":"nuevo"}</span></td><td>${esc(p.a.nombre)}</td><td>${TYPES[p.a.tipo]}</td><td>${esc(what(p.a))}</td>
        <td>${esc(p.a.serie)}</td><td>${esc(where(p.a))}</td><td>${fdate(p.a.ciclo.garantia)}</td><td>${fdate(p.a.ciclo.soporte)}</td></tr>`).join("")}</table></div>
    ${isSample()?`<label class="chk"><input type="checkbox" id="i_clear" checked> Borrar antes los equipos de ejemplo</label>`:""}
  </div>
  <div class="foot"><button class="btn" id="m_cancel">Cancelar</button><button class="btn acc" id="m_ok">Importar ${plan.length}</button></div>`;
  veil.classList.add("on");$("#m_cancel").onclick=closeModal;
  $("#m_ok").onclick=()=>{
    const clr=$("#i_clear");
    if(clr&&clr.checked){DB.activos=[];plan.forEach(p=>p.prev=null);}
    plan.forEach(({a,prev,hasTipo,hasEst})=>{
      if(prev){
        const fill=(o,n)=>Object.keys(n).forEach(k=>{if(n[k]&&typeof n[k]!=="object"&&k!=="id"&&k!=="inv")o[k]=n[k];});
        ["nombre","marca","modelo","serie","asignado","notas"].forEach(k=>{if(a[k]&&a[k]!=="SIN NOMBRE")prev[k]=a[k];});
        if(hasTipo)prev.tipo=a.tipo;if(hasEst)prev.estado=a.estado;
        fill(prev.ubicacion,a.ubicacion);fill(prev.compra,a.compra);fill(prev.ciclo,a.ciclo);
        a.historial.forEach(h=>{if(!prev.historial.some(x=>x.texto===h.texto&&x.fecha===h.fecha))prev.historial.push(h);});
        a.adjuntos.forEach(j=>{if(!prev.adjuntos.some(x=>x.ruta===j.ruta))prev.adjuntos.push(j);});
      }else{
        if(!a.inv||DB.activos.some(x=>x.inv.toLowerCase()===a.inv.toLowerCase()))a.inv=nextInv();
        DB.activos.push(a);
      }
    });
    save();closeModal();setTab("cad");toastUndo("Importados "+plan.length+" equipos ("+nNew+" nuevos).");
  };
}
// salas de RackScope en cualquiera de sus formatos
function rackRooms(d){
  if(d&&Array.isArray(d.rooms))return d.rooms.filter(r=>r&&r.state&&Array.isArray(r.state.racks));
  if(d&&Array.isArray(d.racks))return [{name:"Sala",state:d}];
  if(d&&d.state&&Array.isArray(d.state.racks))return [{name:d.name||"Sala",state:d.state}];
  return null;
}
// U de cada equipo tal y como las numera RackScope (filas de 12 columnas, de arriba abajo o al reves)
function rackUs(rk){
  const rows=[];let cur=null,ancho=0;
  (rk.elements||[]).forEach((e,i)=>{if(!e)return;const sp=Math.max(1,Math.min(12,+e.span||12)),u=Math.max(1,+e.u||1);
    if(!cur||ancho+sp>12){cur={idx:[i],u};rows.push(cur);ancho=sp;}else{cur.idx.push(i);cur.u=Math.max(cur.u,u);ancho+=sp;}});
  const total=+rk.u||42,used=rows.reduce((s,r)=>s+r.u,0),tope=Math.max(total,used),out={};let off=0;
  rows.forEach(r=>{const lo=rk.ubot?tope-off-r.u+1:off+1,hi=rk.ubot?tope-off:off+r.u;r.idx.forEach(i=>out[i]=r.u===1?String(lo):Math.min(lo,hi)+"-"+Math.max(lo,hi));off+=r.u;});
  return out;
}
function rackType(e){
  const t=norm((e.name||"")+" "+(e.sub||""));
  if(e.type==="switch")return "switch";if(e.type==="nas")return "cabina";
  if(/firewall|fortigate|pfsense|sophos|cortafuegos/.test(t))return "firewall";if(/router|mikrotik/.test(t))return "router";
  if(/\bsai\b|\bups\b/.test(t))return "sai";if(e.type==="server")return "servidor";
  return guessTipo("",t);
}
function rackImport(name,rooms){
  const items=[];
  rooms.forEach(r=>(r.state.racks||[]).forEach(rk=>{const us=rackUs(rk);(rk.elements||[]).forEach((e,i)=>{
    if(!e||e.type==="panel"||e.type==="hueco")return;
    const nm=str(e.name).trim();if(!nm||/pasacables|pasahilos|organizador|bandeja|regleta|guia de cables/i.test(norm(nm)))return;
    items.push({nombre:nm.slice(0,120),tipo:rackType(e),sala:str(r.name||"Sala").slice(0,120),rack:str(rk.name||"RACK").slice(0,60),u:us[i]||"",sub:str(e.sub).slice(0,300)});
  });}));
  if(!items.length){toast("Ese JSON de RackScope no tiene equipos");return;}
  const key=(n,s,r)=>norm(n)+"|"+norm(s)+"|"+norm(r);
  const ex=new Map();DB.activos.forEach(a=>{ex.set(key(a.nombre,a.ubicacion.sala,a.ubicacion.rack),a);if(!ex.has("n|"+norm(a.nombre)))ex.set("n|"+norm(a.nombre),a);});
  const plan=items.map(it=>({it,prev:ex.get(key(it.nombre,it.sala,it.rack))||ex.get("n|"+norm(it.nombre))||null}));
  const nNew=plan.filter(p=>!p.prev).length;
  modal.className="modal wide";
  modal.innerHTML=`<h3>Equipos de RackScope · ${esc(name)}</h3>
  <div class="body">
    <div class="hint"><b>${items.length} equipos</b> en ${rooms.length} sala${rooms.length===1?"":"s"}: ${nNew} nuevos. Los que ya tienes con el mismo nombre solo cambian de sala, rack y U. Los paneles de parcheo y los huecos no se traen.</div>
    <div class="prev"><table><tr><th></th><th>Nombre</th><th>Tipo</th><th>Sala</th><th>Rack</th><th>U</th></tr>
      ${plan.map(p=>`<tr><td><span class="tag ${p.prev?"upd":"new"}">${p.prev?"actualiza":"nuevo"}</span></td><td>${esc(p.it.nombre)}</td><td>${TYPES[p.it.tipo]}</td><td>${esc(p.it.sala)}</td><td>${esc(p.it.rack)}</td><td>${esc(p.it.u)}</td></tr>`).join("")}</table></div>
    <div class="hint">Después abre cada ficha y añade el <b>nº de serie</b> y las fechas de garantía y soporte.</div>
  </div>
  <div class="foot"><button class="btn" id="m_cancel">Cancelar</button><button class="btn acc" id="m_ok">Traer ${items.length}</button></div>`;
  veil.classList.add("on");$("#m_cancel").onclick=closeModal;
  $("#m_ok").onclick=()=>{
    plan.forEach(({it,prev})=>{
      if(prev){prev.ubicacion={sala:it.sala,rack:it.rack,u:it.u};return;}
      const a=blankAsset();Object.assign(a,{inv:nextInv(),nombre:it.nombre,tipo:it.tipo,ubicacion:{sala:it.sala,rack:it.rack,u:it.u},notas:it.sub?"RackScope: "+it.sub:""});
      DB.activos.push(a);
    });
    save();closeModal();setTab("inv");toastUndo("Traídos "+items.length+" equipos de RackScope.");
  };
}

function openFromHash(){
  const m=/[#&]inv=([^&]+)/.exec(location.hash);if(!m)return;
  let inv="";try{inv=decodeURIComponent(m[1]);}catch(e){return;}
  const a=DB.activos.find(x=>x.inv.toLowerCase()===inv.toLowerCase());
  if(!a){toast("No encuentro el equipo "+inv+" en este navegador");return;}
  if(DB.tab!=="inv")setTab("inv");openAsset(a);
}
